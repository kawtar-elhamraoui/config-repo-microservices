# Configuration SPÉCIFIQUE service-client
server:
  port: 8082

# Base de données service-client
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/client_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # ====== CONFIGURATION RABBITMQ AJOUTÉE ======
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: true
        missing-queues-fatal: false
        concurrency: 1
        max-concurrency: 3

# Configuration Resilience4j pour service-client
resilience4j:
  circuitbreaker:
    instances:
      database:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5

# Configuration Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Configuration Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.exemple.client: DEBUG
    org.springframework.amqp: INFO