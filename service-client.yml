# Configuration SPÉCIFIQUE service-client
spring:
  application:
    name: service-client

server:
  port: 8082

# Base de données service-client
datasource:
  url: jdbc:mysql://localhost:3306/client_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
  username: root
  password: Kawtar
  driver-class-name: com.mysql.cj.jdbc.Driver

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.exemple.client: DEBUG
    org.springframework.cloud.config: DEBUG
    org.springframework.cloud: DEBUG