# Configuration SPÉCIFIQUE service-client
server:
  port: 8082

spring:
  application:
    name: service-client
  # Base de données service-client
  datasource:
    url: jdbc:mysql://localhost:3306/client_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar
  
  # RabbitMQ spécifique (optionnel, hérite du global)
  rabbitmq:
    listener:
      simple:
        auto-startup: true
        concurrency: 1
        max-concurrency: 3
    deserialization:
      trust-all: true 

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      database:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5

logging:
  level:
    com.exemple.client: DEBUG
    com.exemple.client.service.NotificationService: DEBUG