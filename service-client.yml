# Configuration SPÉCIFIQUE service-client
server:
  port: 8082

# Base de données service-client
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/client_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
