# Configuration GLOBALE pour TOUS les services
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  
  # ====== MODIFIEZ L'EXCLUSION ======
  # Soit commentez-la complètement
  # autoconfigure:
  #   exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  
  # Soit remplacez par une configuration par défaut
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO