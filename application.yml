# Configuration GLOBALE pour TOUS les services
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  
  # ====== SUPPRIMEZ COMPLÈTEMENT L'EXCLUSION ======
  # Chaque service gère sa propre exclusion
  # PAS D'exclusion ici !
  # autoconfigure:
  #   exclude: 

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO