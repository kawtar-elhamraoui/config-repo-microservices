# Configuration GLOBALE pour TOUS les services
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      
  # ====== DÉSACTIVER RABBITMQ GLOBALEMENT ======
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration$RabbitConnectionFactoryCreator
      - org.springframework.boot.autoconfigure.amqp.RabbitAnnotationDrivenConfiguration
  
  # ====== Configuration RabbitMQ (commentée) ======
  # rabbitmq:
  #   host: localhost
  #   port: 5672
  #   username: admin
  #   password: admin
  #   connection-timeout: 5000
  
  # Activation auto-configuration
  # autoconfigure:
  #   exclude: []  # À vider ou commenter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO