# Configuration SPÉCIFIQUE service-commande
spring:
  application:
    name: service-commande  
  
  config:
    activate:
      on-profile: default

server:
  port: 8084

# Base de données service-commande
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/commande_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # Configuration RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: true
        missing-queues-fatal: false
        concurrency: 1
        max-concurrency: 3

# URLs des autres services
service:
  client:
    url: http://localhost:8082
  produit:
    url: http://localhost:8083

# Configuration Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default
  
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default

# Configuration Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Logging spécifique
logging:
  level:
    com.exemple.commande: DEBUG
    org.springframework.amqp: DEBUG
    com.exemple.commande.service.CommandeService: DEBUG