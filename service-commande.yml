# Configuration SPÉCIFIQUE service-commande
server:
  port: 8084

# Base de données service-commande
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/commande_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar
  
  # ========== CONFIGURATION RABBITMQ SIMPLIFIÉE ==========
  # Configuration TRÈS simple pour éviter les erreurs
  rabbitmq:
    host: localhost
    port: 5672
    # Pas de username/password pour le développement
    
  # ========== EXCLURE RABBITMQ TEMPORAIREMENT ==========
  # Solution TEMPORAIRE : exclure RabbitMQ pour démarrer
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# URLs des autres services
service:
  client:
    url: http://localhost:8082
  produit:
    url: http://localhost:8083
    
# Configuration Resilience4j pour service-commande
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default
  
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    circuitbreakers:
      enabled: true
  resilience4j:
    circuitbreaker:
      metrics:
        enabled: true

logging:
  level:
    com.exemple.commande: DEBUG