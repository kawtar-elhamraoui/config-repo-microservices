server:
  port: 8084

# Base de données service-commande
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/commande_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar
  
  # ====== OVERRIDE : ACTIVER RABBITMQ pour ce service ======
  # Remplace l'exclusion globale par une configuration vide
  autoconfigure:
    exclude:  # Vide - pas d'exclusion
  
  # Configuration RabbitMQ minimale
  rabbitmq:
    host: localhost
    port: 5672
    # Pas d'authentification pour développement
    listener:
      simple:
        auto-startup: false  # IMPORTANT : désactiver les listeners au démarrage

# URLs des autres services
service:
  client:
    url: http://localhost:8082
  produit:
    url: http://localhost:8083

# Configuration Resilience4j pour service-commande
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default
  
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    circuitbreakers:
      enabled: true
  resilience4j:
    circuitbreaker:
      metrics:
        enabled: true

logging:
  level:
    com.exemple.commande: DEBUG