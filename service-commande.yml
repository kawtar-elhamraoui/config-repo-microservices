server:
  port: 8084

# Base de données service-commande
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/commande_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar
    driver-class-name: com.mysql.cj.jdbc.Driver  # AJOUTEZ CE CI !
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # ====== CORRECTION : exclusion EXPLICITE vide ======
  autoconfigure:
    exclude: []  # Liste VIDE explicitement, pas un commentaire !
  
  # Configuration RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: true
        missing-queues-fatal: false

# URLs des autres services
service:
  client:
    url: http://localhost:8082
  produit:
    url: http://localhost:8083

# Configuration Resilience4j pour service-commande
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default
  
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    circuitbreakers:
      enabled: true
  resilience4j:
    circuitbreaker:
      metrics:
        enabled: true

logging:
  level:
    com.exemple.commande: DEBUG