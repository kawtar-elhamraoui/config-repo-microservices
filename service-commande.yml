# Configuration SPÉCIFIQUE service-commande
server:
  port: 8084

spring:
  application:
    name: service-commande
  # Base de données service-commande
  datasource:
    url: jdbc:mysql://localhost:3306/commande_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar
  
  # RabbitMQ spécifique
  rabbitmq:
    listener:
      simple:
        auto-startup: true
        concurrency: 1
        max-concurrency: 3
    deserialization:
      trust-all: true 

# URLs des autres services
service:
  client:
    url: http://localhost:8082
  produit:
    url: http://localhost:8083

# Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default
  
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    circuitbreakers:
      enabled: true
  resilience4j:
    circuitbreaker:
      metrics:
        enabled: true

logging:
  level:
    com.exemple.commande: DEBUG
    com.exemple.commande.service.CommandeService: DEBUG