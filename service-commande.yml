# Configuration SPÉCIFIQUE service-commande
server:
  port: 8084

# Base de données service-commande
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/commande_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar
  
  # ========== CONFIGURATION RABBITMQ CORRIGÉE ==========
  # Configuration minimale pour démarrer
  rabbitmq:
    host: localhost
    port: 5672
    # Essayer d'abord sans authentification (pour développement)
    # username: guest
    # password: guest
    connection-timeout: 3000
    # Désactiver les listeners au démarrage pour éviter les erreurs
    listener:
      simple:
        auto-startup: false
        missing-queues-fatal: false
  
  # ========== OVERRIDE L'EXCLUSION GLOBALE ==========
  # Si vous avez une exclusion globale dans application.yml,
  # cette ligne la remplace pour service-commande
  autoconfigure:
    exclude:  # Vide - pas d'exclusion pour ce service

# URLs des autres services
service:
  client:
    url: http://localhost:8082
  produit:
    url: http://localhost:8083

# Configuration Resilience4j pour service-commande
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default
  
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      clientService:
        baseConfig: default
      produitService:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    circuitbreakers:
      enabled: true
  resilience4j:
    circuitbreaker:
      metrics:
        enabled: true

logging:
  level:
    com.exemple.commande: DEBUG