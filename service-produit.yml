# Configuration SPÉCIFIQUE service-produit
spring:
  application:
    name: service-produit

server:
  port: 8083

# Base de données service-produit
datasource:
  url: jdbc:mysql://localhost:3306/produit_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
  username: root
  password: Kawtar
  driver-class-name: com.mysql.cj.jdbc.Driver

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect
      format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.exemple.produit: DEBUG