# Configuration SPÉCIFIQUE service-produit
server:
  port: 8083

# Base de données service-produit
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/produit_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Kawtar

# Configuration Resilience4j pour service-produit
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      clientService:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.exemple.produit: DEBUG