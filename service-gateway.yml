# service-gateway.yml - SUR GITHUB
server:
  port: 8080

spring:
  application:
    name: service-gateway
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false  # IMPORTANT pour éviter les conflits
      
      routes:
        # Service-client avec Circuit Breaker
        - id: client-service-circuit-breaker
          uri: lb://SERVICE-CLIENT
          predicates:
            - Path=/api/auth/**, /api/clients/**
          filters:
            - name: CircuitBreaker
              args:
                name: clientCircuitBreaker
                fallbackUri: forward:/fallback/client
                statusCodes: 500,502,503,504
            - AddRequestHeader=X-Gateway-Service, service-gateway
            - AddRequestHeader=X-Circuit-Breaker, enabled
        
        # Service-produit avec Circuit Breaker
        - id: produit-service-circuit-breaker
          uri: lb://SERVICE-PRODUIT
          predicates:
            - Path=/api/produits/**
          filters:
            - name: CircuitBreaker
              args:
                name: produitCircuitBreaker
                fallbackUri: forward:/fallback/produit
            - AddRequestHeader=X-Gateway-Service, service-gateway
        
        # Service-commande avec Circuit Breaker
        - id: commande-service-circuit-breaker
          uri: lb://SERVICE-COMMANDE
          predicates:
            - Path=/api/commandes/**
          filters:
            - name: CircuitBreaker
              args:
                name: commandeCircuitBreaker
                fallbackUri: forward:/fallback/commande
            - AddRequestHeader=X-Gateway-Service, service-gateway

# Circuit Breaker configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
        registerHealthIndicator: true
    
    instances:
      clientCircuitBreaker:
        baseConfig: default
      produitCircuitBreaker:
        baseConfig: default
      commandeCircuitBreaker:
        baseConfig: default

# Eureka configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    enabled: true
    fetch-registry: true
    register-with-eureka: true
    # Pour un refresh plus rapide
    registry-fetch-interval-seconds: 5
    instance-info-replication-interval-seconds: 30
  
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# Actuator pour le monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"  # Tous les endpoints pour la démo
      base-path: /actuator
      path-mapping:
        health: healthcheck
  
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
    metrics:
      enabled: true
  
  metrics:
    export:
      prometheus:
        enabled: true

# Logging pour le debug
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    resilience4j.circuitbreaker: DEBUG